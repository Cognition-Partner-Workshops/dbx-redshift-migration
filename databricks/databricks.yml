bundle:
  name: dbx-redshift-migration

variables:
  catalog:
    description: Target catalog for migration outputs
    default: mig_redshift_dev
  warehouse_id:
    description: SQL warehouse for validation / SQL tasks.
    # No default — set with `databricks bundle deploy --var warehouse_id=<id>`
    # or env BUNDLE_VAR_warehouse_id.

include:
  - resources/*.yml

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: mig_redshift_dev
  prod:
    mode: production
    variables:
      catalog: mig_redshift
