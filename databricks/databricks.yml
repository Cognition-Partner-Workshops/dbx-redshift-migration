bundle:
  name: dbx-redshift-migration

include:
  - resources/*.yml

variables:
  catalog:
    description: Target catalog for migration outputs
    default: mig_redshift_dev
  warehouse_id:
    description: SQL warehouse for validation / SQL tasks.
    # No default — set with `databricks bundle deploy --var warehouse_id=<id>`
    # or env BUNDLE_VAR_warehouse_id.

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: mig_redshift_dev
    resources:
      jobs:
        nightly_mart_refresh:
          schedule:
            pause_status: PAUSED
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mig_redshift
