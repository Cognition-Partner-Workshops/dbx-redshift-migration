# Legacy: legacy/redshift/units/daily_revenue/report.sql (monthly revenue by channel)
#   SELECT DATE_TRUNC('month', order_date)::DATE AS order_month, sales_channel,
#          SUM(order_count) AS order_count, SUM(revenue) AS revenue
#   FROM mart.daily_revenue GROUP BY 1, 2
version: 1.1
comment: Order count and revenue per order day and sales channel (gold.daily_revenue, pre-aggregated day x channel).
source: gold.daily_revenue
dimensions:
  - name: order_date
    expr: order_date
    comment: Order day (TRUNC(order_ts) in the legacy ETL).
  - name: order_month
    expr: CAST(DATE_TRUNC('MONTH', order_date) AS DATE)
    comment: First day of the order month (legacy DATE_TRUNC('month', order_date)::DATE).
  - name: sales_channel
    expr: sales_channel
    comment: Order sales channel (web, mobile, store, phone).
measures:
  - name: order_count
    expr: SUM(order_count)
    comment: Distinct orders, summed over the pre-aggregated day x channel mart.
  - name: revenue
    expr: CAST(SUM(revenue) AS DECIMAL(38,2))
    comment: Line revenue (quantity * unit_price), summed over the pre-aggregated mart.
