# Legacy: legacy/redshift/units/customer_ltv/report.sql
#   SELECT region, COUNT(*) AS customers, SUM(order_count) AS orders,
#          SUM(ltv) AS total_ltv, AVG(ltv) AS avg_ltv
#   FROM mart.customer_ltv GROUP BY region
version: 1.1
comment: Customer lifetime value (gold.customer_ltv, one row per customer).
source: gold.customer_ltv
dimensions:
  - name: customer_id
    expr: customer_id
  - name: region
    expr: region
measures:
  - name: customers
    expr: COUNT(1)
  - name: orders
    expr: SUM(order_count)
  - name: total_ltv
    expr: CAST(SUM(ltv) AS DECIMAL(38,2))
    comment: Redshift SUM over DECIMAL(14,2) returns DECIMAL(38,2).
  - name: avg_ltv
    expr: CAST(CAST((SUM(ltv) * 100) DIV NULLIF(COUNT(ltv), 0) AS DECIMAL(36,0)) * 0.01 AS DECIMAL(38,2))
    comment: Redshift AVG over DECIMAL(14,2) returns DECIMAL(38,2) truncated (not rounded) to scale 2.
