# Lakeflow job converted from legacy/redshift/99_orchestration/refresh_schedule.yaml.
#
# DAG preserved from the legacy nightly job:
#   load_core -> wave_1a (5 unit tasks) || wave_1b (13 unit tasks)
#   -> exec_summary (after ALL 18 units)
#   -> mart_views + finance_export (finance export kept after exec_summary;
#      legacy depended only on wave_1b — the stricter edge also preserves order)
#
# The legacy `0 2 * * *` (minute hour dom month dow) is converted to the
# Quartz format Databricks expects: `0 0 2 * * ?` — seconds field prepended
# (0) and `?` ("no specific value") in day-of-week, required because
# day-of-month is `*`. Same firing time: 02:00 UTC daily.
resources:
  jobs:
    nightly_mart_refresh:
      name: nightly_mart_refresh
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: load_core
          max_retries: 1
          sql_task:
            file:
              path: ../job/load_core.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog}
        - task_key: daily_revenue
          depends_on:
            - task_key: load_core
          max_retries: 1
          sql_task:
            file:
              path: ../job/unit_daily_revenue.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog}
        - task_key: customer_ltv
