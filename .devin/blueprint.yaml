# Devin environment for migration sessions.
initialize:
  - run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sudo sh
maintenance:
  - run: pip install -r requirements.txt

knowledge:
  - title: env vars and secrets
    body: |
      Validation needs DATABRICKS_HOST + DATABRICKS_TOKEN (or
      DATABRICKS_CONFIG_PROFILE), DATABRICKS_WAREHOUSE_ID, and MIG_CATALOG
      (default mig_redshift_dev). Redshift vars (REDSHIFT_HOST, REDSHIFT_PORT,
      REDSHIFT_USER, REDSHIFT_PASSWORD, REDSHIFT_DATABASE) exist only on the
      operator machine that captured goldens — migration sessions never need
      them and must never run tools/legacy_redshift.py.
  - title: make targets
    body: |
      make check (ruff + pytest + manifest checks, no secrets), make seed,
      make db-setup / db-reset (Databricks catalog setup), make validate UNIT=x
      (build converted SQL + compare to goldens), make validate-all,
      make lakebridge-analyze / lakebridge-transpile UNIT=x.
  - title: guardrails
    body: |
      See AGENTS.md: legacy/, golden/, data/seed/, validation/ are read-only;
      one unit per child session; write only databricks/units/<unit>/ plus
      evidence and a coverage.md row; never merge to main.
